  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    .rank-1 { background: linear-gradient(90deg,rgba(234,179,8,.08),transparent); }
    .rank-2 { background: linear-gradient(90deg,rgba(156,163,175,.06),transparent); }

</head>
<body class="min-h-screen text-gray-100 grid-bg">
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;
const BASE = window.location.origin;
const MASTER_KEY = "COD_MASTER_INTEL";

async function apiFetch(path, headers = {}) {
  try {
    const r = await fetch(BASE + path, { headers });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function apiMutation(method, path, body, headers = {}) {
  try {
    const r = await fetch(BASE + path, {
      method,
      headers: { "Content-Type": "application/json", ...headers },
      body: body != null ? JSON.stringify(body) : undefined,
    });
    return { ok: r.ok, data: r.ok ? await r.json() : null };
  } catch { return { ok: false, data: null }; }
}

function masterHeaders() {
  return { "x-master-key": MASTER_KEY };
}

// ── Utilities ────────────────────────────────────────────────────────────────
function timeAgo(dateStr) {
  if (!dateStr) return "Nunca";
  const d = new Date(dateStr);
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return "hace " + diff + "s";
  if (diff < 3600) return "hace " + Math.floor(diff / 60) + "min";
  if (diff < 86400) return "hace " + Math.floor(diff / 3600) + "h";
  return "hace " + Math.floor(diff / 86400) + "d";
}

function fmtNum(n) { return (n ?? 0).toLocaleString("es-ES"); }

function Icon({ name, size = 16, cls = "" }) {
  const d = ICONS[name] || "";

    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"

// ── Stat Card ────────────────────────────────────────────────────────────────
function StatCard({ label, value, color = "blue", sub, icon }) {
  const border = { red:"border-red-600/50 glow-red", blue:"border-blue-500/50 glow-blue", gold:"border-yellow-500/50 glow-gold", green:"border-green-500/50 glow-green", purple:"border-purple-500/50 glow-purple" };

  return (
    <div className={`bg-gray-900/50 border ${border[color] ?? border.blue} rounded-xl p-5 slide-in backdrop-blur-sm`}>
      <div className="flex items-center justify-between mb-2">
        <p className="text-gray-500 text-xs uppercase tracking-widest">{label}</p>
        {icon && <span className="text-lg">{icon}</span>}
      </div>
      <p className={`text-3xl font-bold ${text[color] ?? text.blue}`}>{value ?? "—"}</p>
      {sub && <p className="text-gray-600 text-xs mt-1">{sub}</p>}

  );
}

// ── Spinner ──────────────────────────────────────────────────────────────────
function Spinner() {

// ── Empty State ───────────────────────────────────────────────────────────────
function Empty({ icon = "📡", msg }) {

// ── Heatmap ──────────────────────────────────────────────────────────────────
function ConflictHeatmap({ intel }) {
  const grid = 10;
  const cells = {};
  intel.forEach(item => {
    const m = item.coords?.match(/(\d+)[:\s,xX](\d+)/);
    if (m) {
      const cx = Math.floor((parseInt(m[1]) % 1000) / 100);
      const cy = Math.floor((parseInt(m[2]) % 1000) / 100);
      const key = `${cx},${cy}`;
      cells[key] = (cells[key] || 0) + 1;
    }
  });
  const maxVal = Math.max(...Object.values(cells), 1);
  return (
    <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-5">
      <h3 className="text-sm font-semibold text-gray-300 mb-4 flex items-center gap-2">
        <span className="w-2 h-2 bg-red-500 rounded-full pulse" />
        Mapa de Calor — Zonas de Conflicto
      </h3>
      <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${grid}, 1fr)` }}>
        {Array.from({ length: grid * grid }, (_, i) => {
          const x = i % grid, y = Math.floor(i / grid);
          const count = cells[`${x},${y}`] || 0;
          const intensity = count / maxVal;
          const alpha = Math.round(intensity * 200).toString(16).padStart(2, "0");
          const bg = count > 0 ? `#ef4444${alpha}` : "#111827";
          return (
            <div key={i} className="heatmap-cell rounded aspect-square"
              style={{ background: bg, minWidth: 0 }}
              title={count > 0 ? `Zona (${x*100}:${y*100}) — ${count} evento${count>1?"s":""}` : ""} />
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4 text-xs text-gray-600">
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-gray-800 inline-block"/>Sin actividad</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-red-800/60 inline-block"/>Media</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-red-500 inline-block"/>Alta</span>
      </div>
    </div>
  );
}

// ── Sanctions Table ───────────────────────────────────────────────────────────

  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-xs text-gray-500 uppercase border-b border-gray-800">
            <th className="text-left py-2 pr-3">Tipo</th>
            <th className="text-left py-2 pr-3">Soldado</th>
            <th className="text-left py-2 pr-3 hidden md:table-cell">Alianza</th>

        </thead>
        <tbody>
          {sanctions.map((s, i) => (

// ── Inactivity Table ──────────────────────────────────────────────────────────
function InactivityTable({ inactive, guildMap }) {
  if (!inactive.length) return (
    <div className="text-center py-12">
      <div className="text-4xl mb-3">✅</div>
      <p className="text-green-400 font-semibold">Sin inactivos detectados</p>
      <p className="text-gray-600 text-sm mt-1">Todos los miembros tienen actividad reciente</p>
    </div>
  );
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-xs text-gray-500 uppercase border-b border-gray-800">
            <th className="text-left py-2 pr-3">IGN</th>
            <th className="text-left py-2 pr-3 hidden sm:table-cell">Alianza</th>
            <th className="text-right py-2 pr-3">Pts Semana</th>
            <th className="text-right py-2">Última Actividad</th>
          </tr>
        </thead>
        <tbody>
          {inactive.map((m, i) => {
            const daysAgo = Math.floor((Date.now() - new Date(m.lastActivity).getTime()) / 86400000);
            const severity = daysAgo > 14 ? "text-red-400" : daysAgo > 7 ? "text-orange-400" : "text-yellow-400";
            return (
              <tr key={i} className="border-b border-gray-900/60 transition">
                <td className="py-2.5 pr-3">
                  <span className="text-white font-medium">{m.ign || "Sin IGN"}</span>
                  <span className="text-gray-600 text-xs ml-2 font-mono hidden sm:inline">#{m.discordId?.slice(-4)}</span>
                </td>
                <td className="py-2.5 pr-3 text-gray-500 hidden sm:table-cell">{guildMap?.[m.guildId] ?? "—"}</td>
                <td className="py-2.5 pr-3 text-right text-gray-500">{m.weeklyPoints ?? 0}</td>
                <td className={`py-2.5 text-right font-semibold ${severity}`}>{timeAgo(m.lastActivity)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Tabs Component ────────────────────────────────────────────────────────────
function Tabs({ tabs, active, onChange, color = "blue" }) {
  const activeColor = { blue:"text-blue-400", red:"text-red-400" };
  return (
    <div className="flex gap-0.5 mb-5 bg-gray-900/60 p-1 rounded-xl border border-gray-800/60 overflow-x-auto">
      {tabs.map(t => (
        <button key={t.id} onClick={() => onChange(t.id)}
          className={`flex-shrink-0 flex items-center gap-1.5 text-xs py-2 px-3 rounded-lg transition-all font-medium whitespace-nowrap ${
            active === t.id
              ? (color === "red" ? "bg-red-900/50 text-red-200 border border-red-800" : "bg-blue-900/40 text-blue-200 border border-blue-800")
              : "text-gray-500 hover:text-gray-300 hover:bg-gray-800/40"
          }`}>
          {t.icon && <span>{t.icon}</span>}
          {t.label}
        </button>
      ))}
    </div>
  );
}

// ── Spy Reports Tab ───────────────────────────────────────────────────────────
const SPY_STATUS = {
  open:          { label: "Abierto",       cls: "bg-yellow-900/60 text-yellow-300 border-yellow-700" },
  investigating: { label: "Investigando",  cls: "bg-blue-900/60 text-blue-300 border-blue-700" },
  confirmed:     { label: "Confirmado",    cls: "bg-red-900/60 text-red-300 border-red-700" },
  cleared:       { label: "Descartado",    cls: "bg-green-900/60 text-green-300 border-green-700" },
};
function SpyReportsTab({ reports: initial, guildMap }) {
  const [reports, setReports] = useState(initial);
  const [busy, setBusy] = useState(null);
  const [filter, setFilter] = useState("all");

  const visible = filter === "all" ? reports : reports.filter(r => r.status === filter);

  async function changeStatus(id, status) {
    setBusy(id);
    const res = await apiMutation("PATCH", `/api/dashboard/spy-reports/${id}`, { status }, masterHeaders());
    if (res.ok) setReports(prev => prev.map(r => r._id === id ? { ...r, status } : r));
    setBusy(null);
  }

  return (
    <div>
      <div className="flex gap-2 mb-4 flex-wrap">
        {["all","open","investigating","confirmed","cleared"].map(f => (

// ── Blacklist Tab ─────────────────────────────────────────────────────────────
function BlacklistTab({ entries: initial, guildMap, guilds }) {
  const [entries, setEntries] = useState(initial);
  const [busy, setBusy] = useState(null);
  const [form, setForm] = useState({ guildId: guilds[0]?.guildId ?? "", ign: "", reason: "", notes: "" });
  const [adding, setAdding] = useState(false);
  const [err, setErr] = useState("");

  async function remove(id) {
    setBusy(id);
    const res = await apiMutation("DELETE", `/api/dashboard/blacklist/${id}`, null, masterHeaders());
    if (res.ok) setEntries(prev => prev.filter(e => e._id !== id));
    setBusy(null);
  }

  async function add(e) {
    e.preventDefault();
    if (!form.ign || !form.reason || !form.guildId) { setErr("IGN, motivo y servidor son obligatorios"); return; }
    setAdding(true); setErr("");
    const res = await apiMutation("POST", "/api/dashboard/blacklist", form, masterHeaders());
    if (res.ok) {
      setEntries(prev => [res.data.entry, ...prev]);
      setForm(f => ({ ...f, ign: "", reason: "", notes: "" }));
    } else { setErr("Error al agregar la entrada"); }
    setAdding(false);
  }

  return (
    <div>
      {/* Add form */}
      <form onSubmit={add} className="bg-gray-900/60 border border-gray-800 rounded-xl p-4 mb-5">
        <h3 className="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">⛔ Agregar a Lista Negra</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label className="text-xs text-gray-500 mb-1 block">Servidor</label>
            <select value={form.guildId} onChange={e => setForm(f => ({ ...f, guildId: e.target.value }))}
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-red-700">
              {guilds.map(g => <option key={g.guildId} value={g.guildId}>{guildMap[g.guildId] ?? g.guildId}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">IGN del jugador</label>
            <input value={form.ign} onChange={e => setForm(f => ({ ...f, ign: e.target.value }))} placeholder="NombreEnJuego"
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-700 outline-none focus:border-red-700" />
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">Motivo</label>
            <input value={form.reason} onChange={e => setForm(f => ({ ...f, reason: e.target.value }))} placeholder="Espía confirmado, robo, etc."
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-700 outline-none focus:border-red-700" />
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">Notas adicionales (opcional)</label>
            <input value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} placeholder="Contexto extra..."
              className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-700 outline-none focus:border-red-700" />
          </div>
        </div>
        {err && <p className="text-red-400 text-xs mb-2">⚠️ {err}</p>}
        <button type="submit" disabled={adding}
          className="bg-red-800 hover:bg-red-700 disabled:opacity-50 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
          {adding ? "Agregando…" : "⛔ Agregar"}
        </button>
      </form>

      {/* List */}
      {!entries.length && <Empty icon="✅" msg="Lista negra vacía" />}
      <div className="space-y-2">
        {entries.map(e => (
          <div key={e._id} className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 flex items-center gap-3 hover:border-gray-700 transition">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">

// ── Events Tab ────────────────────────────────────────────────────────────────
function EventosTab({ events: initial, guildMap }) {
  const [events, setEvents] = useState(initial);
  const [busy, setBusy] = useState(null);
  const [showPast, setShowPast] = useState(false);

  const now = Date.now();
  const upcoming = events.filter(e => !e.closed && new Date(e.scheduledFor).getTime() > now);
  const past     = events.filter(e => e.closed || new Date(e.scheduledFor).getTime() <= now);
  const visible  = showPast ? past : upcoming;

  async function cancel(id) {
    setBusy(id);
    const res = await apiMutation("PATCH", `/api/dashboard/events/${id}/cancel`, {}, masterHeaders());
    if (res.ok) setEvents(prev => prev.map(e => e._id === id ? { ...e, closed: true } : e));
    setBusy(null);
  }

  const TIPO_ICON = { guerra:"⚔️", kvk:"🌍", rally:"🏹", construccion:"🏗️", general:"📅" };

  return (
    <div>
      <div className="flex gap-2 mb-4">
        {[false, true].map(p => (
          <button key={p} onClick={() => setShowPast(p)}
            className={`text-xs px-3 py-1.5 rounded-lg border transition font-medium ${showPast===p?"bg-blue-900/40 text-blue-200 border-blue-700":"text-gray-500 border-gray-800 hover:border-gray-700"}`}>
            {p ? `Pasados (${past.length})` : `Próximos (${upcoming.length})`}
          </button>
        ))}
      </div>
      {!visible.length && <Empty icon="📅" msg={showPast ? "Sin eventos pasados" : "Sin eventos próximos"} />}
      <div className="space-y-2">
        {visible.map(ev => {
          const date = new Date(ev.scheduledFor);
          const confirmed = ev.confirmed?.length ?? 0;
          const maybe = ev.maybe?.length ?? 0;
          const declined = ev.declined?.length ?? 0;
          return (
            <div key={ev._id} className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 hover:border-gray-700 transition">
              <div className="flex items-start justify-between gap-3 flex-wrap">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl">{TIPO_ICON[ev.tipo] ?? "📅"}</span>
                    <span className="font-semibold text-white">{ev.title}</span>
                    {ev.closed && <span className="text-xs bg-gray-800 text-gray-500 border border-gray-700 px-2 py-0.5 rounded-full">Cerrado</span>}
                  </div>
                  <p className="text-xs text-gray-500 mt-0.5">{date.toLocaleString("es-ES")} · {guildMap[ev.guildId] ?? ev.guildId}</p>
                </div>
                {!ev.closed && (
                  <button disabled={busy===ev._id} onClick={() => cancel(ev._id)}
                    className="text-xs text-orange-500 hover:text-orange-400 border border-orange-900 hover:border-orange-700 px-3 py-1.5 rounded-lg transition disabled:opacity-40 shrink-0">
                    {busy===ev._id ? "…" : "Cancelar"}
                  </button>
                )}
              </div>
              <p className="text-sm text-gray-400 mt-2 line-clamp-1">{ev.description}</p>
              <div className="flex gap-4 mt-3 text-xs">
                <span className="text-green-400">✅ {confirmed} confirmados</span>
                <span className="text-yellow-400">🤔 {maybe} tal vez</span>
                <span className="text-red-400">❌ {declined} no pueden</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Polls Tab ─────────────────────────────────────────────────────────────────
function PollsTab({ polls: initial, guildMap }) {
  const [polls, setPolls] = useState(initial);
  const [busy, setBusy] = useState(null);
  const [showClosed, setShowClosed] = useState(false);

  const active = polls.filter(p => !p.closed);
  const closed = polls.filter(p => p.closed);
  const visible = showClosed ? closed : active;

  async function closePoll(id) {
    setBusy(id);
    const res = await apiMutation("PATCH", `/api/dashboard/polls/${id}/close`, {}, masterHeaders());
    if (res.ok) setPolls(prev => prev.map(p => p._id === id ? { ...p, closed: true } : p));
    setBusy(null);
  }

  function voteSummary(poll) {
    const votesObj = poll.votes instanceof Object ? poll.votes : {};
    const counts = poll.options.map((_, i) => {
      let total = 0;
      Object.values(votesObj).forEach(v => { if (Number(v) === i) total++; });
      return total;
    });
    const total = counts.reduce((a, b) => a + b, 0);
    return { counts, total };
  }

  return (
    <div>
      <div className="flex gap-2 mb-4">
        {[false, true].map(c => (
          <button key={c} onClick={() => setShowClosed(c)}
            className={`text-xs px-3 py-1.5 rounded-lg border transition font-medium ${showClosed===c?"bg-blue-900/40 text-blue-200 border-blue-700":"text-gray-500 border-gray-800 hover:border-gray-700"}`}>
            {c ? `Cerradas (${closed.length})` : `Activas (${active.length})`}
          </button>
        ))}
      </div>
      {!visible.length && <Empty icon="🗳️" msg={showClosed ? "Sin polls cerradas" : "Sin polls activas"} />}
      <div className="space-y-3">
        {visible.map(poll => {
          const { counts, total } = voteSummary(poll);
          const winIdx = counts.indexOf(Math.max(...counts));
          return (
            <div key={poll._id} className="bg-gray-900/50 border border-gray-800 rounded-xl p-4 hover:border-gray-700 transition">
              <div className="flex items-start justify-between gap-3 flex-wrap">
                <div className="flex-1 min-w-0">
                  <p className="font-semibold text-white">{poll.question}</p>
                  <p className="text-xs text-gray-500 mt-0.5">
                    {guildMap[poll.guildId] ?? poll.guildId} · {total} voto{total !== 1 ? "s" : ""} · vence {timeAgo(poll.endsAt)}
                  </p>
                </div>
                {!poll.closed && (
                  <button disabled={busy===poll._id} onClick={() => closePoll(poll._id)}
                    className="text-xs text-yellow-500 hover:text-yellow-400 border border-yellow-900 hover:border-yellow-700 px-3 py-1.5 rounded-lg transition disabled:opacity-40 shrink-0">
                    {busy===poll._id ? "…" : "Cerrar poll"}
                  </button>
                )}
              </div>
              <div className="mt-3 space-y-1.5">
                {poll.options.map((opt, i) => {
                  const pct = total > 0 ? Math.round((counts[i] / total) * 100) : 0;
                  const isWin = !poll.closed ? false : i === winIdx;
                  return (
                    <div key={i}>
                      <div className="flex justify-between text-xs mb-0.5">
                        <span className={isWin ? "text-yellow-400 font-semibold" : "text-gray-400"}>{isWin && "🏆 "}{opt}</span>
                        <span className="text-gray-600">{counts[i]} ({pct}%)</span>
                      </div>
                      <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full transition-all pts-bar ${isWin?"bg-yellow-500":"bg-blue-700"}`} style={{ width: `${pct}%` }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Missions Tab ──────────────────────────────────────────────────────────────
function MissionsTab({ claims, weekKey, guildMap }) {
  if (!claims.length) return <Empty icon="🎯" msg={`Sin reclamaciones esta semana (${weekKey})`} />;
  const byGuild = {};
  claims.forEach(c => {
    if (!byGuild[c.guildId]) byGuild[c.guildId] = [];
    byGuild[c.guildId].push(c);
  });
  return (
    <div>
      <p className="text-xs text-gray-500 mb-4">Semana: <span className="text-blue-400 font-mono">{weekKey}</span> · {claims.length} reclamacion{claims.length !== 1 ? "es" : ""} totales</p>
      {Object.entries(byGuild).map(([guildId, gClaims]) => (
        <div key={guildId} className="mb-4">
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">{guildMap[guildId] ?? guildId}</p>
          <div className="space-y-1.5">
            {gClaims.map((c, i) => (
              <div key={i} className="bg-gray-900/50 border border-gray-800 rounded-lg px-4 py-2.5 flex items-center justify-between">
                <span className="text-sm text-white font-mono">{c.discordId}</span>
                <span className="text-xs text-green-400">{timeAgo(c.claimedAt)} · +50 pts</span>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

              {!intel.length && <Empty icon="📡" msg="Sin datos de inteligencia aún" />}

                <div key={i} className="bg-gray-900/50 border border-gray-800 rounded-lg p-3 flex items-start gap-3 hover:border-gray-700 transition">
                  <Badge type={item.actionType} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-xs font-mono text-yellow-400">{item.coords}</span>
                      <span className="text-xs text-gray-600 shrink-0">{new Date(item.timestamp).toLocaleString("es-ES")}</span>
                    </div>
                    <p className="text-sm text-gray-300 mt-0.5 truncate">{item.details}</p>
                    <p className="text-xs text-gray-600 mt-0.5">Alianza: <span className="text-gray-400">{item.allianceTag}</span></p>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* HEATMAP */}
          {tab === "heatmap" && <ConflictHeatmap intel={intel} />}

          {/* DIPLOMACIA */}
          {tab === "diplomacy" && (
            <div className="space-y-2 max-h-[520px] overflow-y-auto pr-1">
              {!diplomacy.pacts.length && <Empty icon="🤝" msg="Sin pactos diplomáticos registrados" />}
              {diplomacy.pacts.map((pact, i) => (
                <div key={i} className="bg-gray-900/50 border border-gray-800 rounded-lg p-3 flex items-center gap-3 hover:border-gray-700 transition">
                  <Badge type={pact.pactType} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between gap-2">
                      <span className="font-semibold text-sm text-white">{pact.targetAlliance}</span>
                      <span className="text-xs text-gray-600 shrink-0">{diplomacy.guildMap[pact.guildId] ?? pact.guildId}</span>
                    </div>
                    {pact.details && <p className="text-xs text-gray-500 mt-0.5">{pact.details}</p>}
                    {pact.expiresAt && (
                      <p className="text-xs text-orange-400 mt-0.5">⏳ Vence: {new Date(pact.expiresAt).toLocaleDateString("es-ES")}</p>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ROSTER */}
          {tab === "roster" && (
            <div className="overflow-x-auto max-h-[520px] overflow-y-auto">
              <table className="w-full text-sm">
                <thead className="sticky top-0 bg-gray-950/90 backdrop-blur-sm">
                  <tr className="text-xs text-gray-500 uppercase border-b border-gray-800">
                    <th className="text-left py-2 pr-3">IGN</th>
                    <th className="text-right py-2 pr-3 hidden sm:table-cell">Poder</th>
                    <th className="text-right py-2 pr-3">Pts Semana</th>
                    <th className="text-right py-2 pr-3 hidden md:table-cell">Pts Total</th>
                    <th className="text-center py-2">Warns</th>
                  </tr>
                </thead>
                <tbody>
                  {!members.length && <tr><td colSpan="5"><Empty icon="👥" msg="Sin miembros registrados" /></td></tr>}
                  {members.map((m, i) => (
                    <tr key={i} className="border-b border-gray-900/60 transition">
                      <td className="py-2 pr-3">
                        <span className="font-medium text-white">{m.ign || "—"}</span>
                        <span className="text-gray-600 text-xs ml-2 font-mono">#{m.discordId?.slice(-4)}</span>
                      </td>
                      <td className="py-2 pr-3 text-right text-blue-400 hidden sm:table-cell">{m.power ? fmtNum(m.power) : "—"}</td>
                      <td className="py-2 pr-3 text-right text-yellow-400 font-semibold">{fmtNum(m.weeklyPoints)}</td>
                      <td className="py-2 pr-3 text-right text-gray-500 hidden md:table-cell">{fmtNum(m.totalPoints)}</td>
                      <td className="py-2 text-center">
                        <span className={`text-xs font-bold ${m.warns > 0 ? "text-red-400" : "text-gray-700"}`}>{m.warns}/3</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* ESPÍAS */}
          {tab === "spy" && (
            <SpyReportsTab
              reports={spyReports.reports}
              guildMap={spyReports.guildMap}
            />
          )}

          {/* LISTA NEGRA */}
          {tab === "blacklist" && (
            <BlacklistTab
              entries={blacklist.entries}
              guildMap={blacklist.guildMap}
              guilds={guilds}
            />
          )}

          {/* EVENTOS */}
          {tab === "events" && (
            <EventosTab
              events={events.events}
              guildMap={events.guildMap}
            />
          )}

          {/* POLLS */}
          {tab === "polls" && (
            <PollsTab
              polls={polls.polls}
              guildMap={polls.guildMap}
            />
          )}

          {/* MISIONES */}
          {tab === "missions" && (
            <MissionsTab
              claims={missions.claims}
              weekKey={missions.weekKey}
              guildMap={missions.guildMap}
            />
          )}
        </div>
      )}
    </div>
  );
}

// ── Guild Avatar ──────────────────────────────────────────────────────────────
function GuildAvatar({ guild, size = 48 }) {
  const [err, setErr] = useState(false);
  if (guild.icon && !err) {
    return (
      <img src={guild.icon} alt={guild.name} onError={() => setErr(true)}
        className="rounded-xl object-cover shrink-0"
        style={{ width: size, height: size }} />
    );
  }
  const initials = (guild.name || "?").slice(0, 2).toUpperCase();
  return (
    <div className="rounded-xl bg-blue-900/60 border border-blue-800 flex items-center justify-center font-bold text-blue-300 shrink-0"
      style={{ width: size, height: size, fontSize: size * 0.35 }}>
      {initials}
    </div>
  );
}

// ── Public Alliance Panel ─────────────────────────────────────────────────────
function PublicPanel({ guilds }) {
  const [selected, setSelected] = useState(null);
  const [selectedGuild, setSelectedGuild] = useState(null);
  const [guildData, setGuildData] = useState(null);
  const [leaderboard, setLeaderboard] = useState(null);
  const [loading, setLoading] = useState(false);
  const [tab, setTab] = useState("stats");

  // Auto-select if only 1 guild
  useEffect(() => {
    if (guilds.length === 1 && !selected) {
      setSelected(guilds[0].guildId);
      setSelectedGuild(guilds[0]);
    }
  }, [guilds]);

  useEffect(() => {
    if (!selected) return;
    setLoading(true);
    setGuildData(null);
    setLeaderboard(null);
    setTab("stats");
    Promise.all([
      apiFetch(`/api/dashboard/guilds/${selected}`),
      apiFetch(`/api/dashboard/guilds/${selected}/leaderboard`),
    ]).then(([gd, lb]) => {
      setGuildData(gd);
      setLeaderboard(lb);
      setLoading(false);
    });
  }, [selected]);

  const TABS = [
    { id:"stats",      icon:"📊", label:"Estadísticas" },
    { id:"leaderboard",icon:"🏆", label:"Ranking Semanal" },
    { id:"alltime",    icon:"⭐", label:"Hall of Fame" },
    { id:"diplomacy",  icon:"🛰️", label:"Diplomacia" },
  ];

  const handleSelect = (g) => {
    setSelected(g.guildId);
    setSelectedGuild(g);
  };

  return (
    <div className="slide-in">
      {/* Server selector — hidden if only 1 guild and it's already selected */}
      {!(guilds.length === 1 && selected) && (
        <div className="mb-6">
          <h2 className="text-lg font-bold text-gray-200 mb-1">Seleccionar Servidor</h2>
          <p className="text-xs text-gray-600">El bot está activo en {guilds.length} servidor{guilds.length !== 1 ? "es" : ""}</p>
        </div>
      )}

      {guilds.length === 0 ? (
        <div className="text-center py-16 text-gray-600">
          <div className="text-4xl mb-3">🏰</div>
          <p>El bot no está en ningún servidor aún</p>
          <p className="text-xs mt-2">Invita el bot a tu servidor de Discord para comenzar</p>
        </div>
      ) : (
        <>
          {/* Guild cards — only show if more than 1 or none selected yet */}
          {(guilds.length > 1 || !selected) && (
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-6">
              {guilds.map(g => (
                <button key={g.guildId} onClick={() => handleSelect(g)}
                  className={`p-4 rounded-xl border text-left transition flex items-center gap-3 ${
                    selected === g.guildId
                      ? "border-blue-500 bg-blue-900/20 glow-blue"
                      : "border-gray-800 bg-gray-900/40 hover:border-gray-700 hover:bg-gray-900/60"
                  }`}>
                  <GuildAvatar guild={g} size={44} />
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-white truncate">{g.name}</p>
                    {g.allianceTag
                      ? <p className="text-xs text-blue-400 font-mono mt-0.5">[{g.allianceTag}]</p>
                      : <p className="text-xs text-gray-600 mt-0.5">Sin configurar</p>
                    }
                    <p className="text-xs text-gray-600 mt-0.5">{fmtNum(g.memberCount)} miembros</p>
                  </div>
                  {selected === g.guildId && (
                    <span className="w-2 h-2 rounded-full bg-blue-400 shrink-0" />
                  )}
                </button>
              ))}
            </div>
          )}

          {loading && <Spinner />}

          {guildData && !loading && (
            <div className="slide-in">
              {/* Selected guild header */}
              {selectedGuild && (
                <div className="flex items-center gap-3 mb-5 pb-4 border-b border-gray-800">
                  <GuildAvatar guild={selectedGuild} size={40} />
                  <div>
                    <h3 className="font-bold text-white">{selectedGuild.name}</h3>
                    <p className="text-xs text-gray-500">
                      {selectedGuild.allianceTag ? `[${selectedGuild.allianceTag}] · ` : ""}
                      {fmtNum(selectedGuild.memberCount)} miembros en Discord
                    </p>
                  </div>
                  {guilds.length > 1 && (
                    <button onClick={() => { setSelected(null); setSelectedGuild(null); setGuildData(null); }}
                      className="ml-auto text-xs text-gray-600 hover:text-gray-400 border border-gray-800 hover:border-gray-700 px-2 py-1 rounded-lg transition">
                      ← Cambiar
                    </button>
                  )}
                </div>
              )}

              <Tabs tabs={TABS} active={tab} onChange={setTab} color="blue" />

              {tab === "stats" && (
                <div>
                  {!guildData.config ? (
                    <div className="text-center py-12 text-gray-600">
                      <div className="text-4xl mb-3">⚙️</div>
                      <p className="text-gray-400 font-semibold mb-1">Servidor sin configurar</p>
                      <p className="text-sm">Usa <code className="bg-gray-800 px-1.5 py-0.5 rounded text-gray-300">/setup alliance</code> en Discord para activar el panel</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      <StatCard label="Registrados en Bot" value={fmtNum(guildData.memberCount)} color="blue" icon="👥" />
                      <StatCard label="Activos Esta Semana" value={fmtNum(guildData.activeCount)} color="green"
                        sub={guildData.memberCount ? `${Math.round((guildData.activeCount/guildData.memberCount)*100)}% participación` : ""} icon="⚡" />
                      <StatCard label="Con Advertencias" value={fmtNum(guildData.warnedCount)} color="red" icon="⚠️" />
                      <StatCard label="Pactos Diplomáticos" value={fmtNum(guildData.pacts?.length)} color="gold" icon="🤝" />
                    </div>
                  )}
                </div>
              )}

              {tab === "leaderboard" && (
                <div>
                  <div className="flex items-center gap-2 mb-4">
                    <div className="w-2 h-2 bg-blue-500 rounded-full pulse" />
                    <span className="text-sm text-gray-400">Top 20 soldados más activos de la semana</span>
                  </div>
                  <LeaderboardTable members={leaderboard?.weekly ?? []} scoreKey="weeklyPoints" label="Pts Semana" />
                </div>
              )}

              {tab === "alltime" && (
                <div>
                  <div className="flex items-center gap-2 mb-4">
                    <span className="text-sm text-gray-400">🏆 Ranking histórico — Hall of Fame de la alianza</span>
                  </div>
                  <LeaderboardTable members={leaderboard?.allTime ?? []} scoreKey="totalPoints" label="Pts Total" />
                </div>
              )}

              {tab === "diplomacy" && (
                <div className="space-y-2">
                  {!guildData.pacts?.length && <Empty icon="🤝" msg="Sin pactos diplomáticos registrados" />}
                  {guildData.pacts?.map((p, i) => (
                    <div key={i} className="bg-gray-900/50 border border-gray-800 rounded-lg p-3 flex items-center gap-3 hover:border-gray-700 transition">
                      <Badge type={p.pactType} />
                      <div className="flex-1">
                        <span className="font-semibold text-sm text-white">{p.targetAlliance}</span>
                        {p.details && <span className="text-xs text-gray-500 ml-2">— {p.details}</span>}
                        {p.expiresAt && (
                          <div className="text-xs text-orange-400 mt-0.5">⏳ Vence: {new Date(p.expiresAt).toLocaleDateString("es-ES")}</div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Master Key Modal ──────────────────────────────────────────────────────────
function MasterKeyModal({ onSubmit, onClose }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);
  const submit = () => {
    if (val === MASTER_KEY) { onSubmit(); }
    else { setErr(true); setTimeout(() => setErr(false), 1500); }
  };
  return (
    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50" onClick={onClose}>
      <div className="bg-gray-900 border border-red-900 rounded-2xl p-8 w-full max-w-sm shadow-2xl slide-in" onClick={e => e.stopPropagation()}>
        <div className="text-center mb-6">
          <div className="text-5xl mb-3">🔐</div>
          <h2 className="text-xl font-bold text-red-400">Acceso Restringido</h2>
          <p className="text-xs text-gray-600 mt-1">Introduce la clave de acceso maestra</p>
        </div>
        <input type="password" value={val} onChange={e => setVal(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()}
          placeholder="Clave de acceso..."
          className={`w-full bg-gray-800 border rounded-xl px-4 py-3 text-sm text-white placeholder-gray-700 outline-none focus:ring-1 transition ${err ? "border-red-500 focus:ring-red-500" : "border-gray-700 focus:ring-red-700"}`}
          autoFocus />
        {err && <p className="text-red-400 text-xs mt-2 text-center">⚠️ Clave incorrecta</p>}
        <button onClick={submit} className="mt-4 w-full bg-red-800 hover:bg-red-700 text-white font-semibold py-2.5 rounded-xl transition">
          Acceder
        </button>
        <button onClick={onClose} className="mt-2 w-full text-gray-700 hover:text-gray-500 text-sm py-1.5 transition">
          Cancelar
        </button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [health, setHealth] = useState(null);
  const [guilds, setGuilds] = useState([]);
  const [masterMode, setMasterMode] = useState(false);
  const [showModal, setShowModal] = useState(false);
  const logoClickCount = useRef(0);
  const logoTimer = useRef(null);

  useEffect(() => {
    apiFetch("/api/healthz").then(h => setHealth(h));
    apiFetch("/api/dashboard/bot-guilds").then(d => setGuilds(d?.guilds ?? []));
  }, []);

  const handleLogoClick = () => {
    logoClickCount.current += 1;
    clearTimeout(logoTimer.current);
    logoTimer.current = setTimeout(() => { logoClickCount.current = 0; }, 3000);
    if (logoClickCount.current >= 5) { logoClickCount.current = 0; setShowModal(true); }
  };

  const online  = health?.discord === "online";
  const connected = health?.mongo === "connected";

  return (
    <div className="min-h-screen">
      {showModal && !masterMode && (
        <MasterKeyModal onSubmit={() => { setMasterMode(true); setShowModal(false); }} onClose={() => setShowModal(false)} />
      )}

      {/* ── Header ─────────────────────────────────────────────────────────── */}
      <header className="border-b border-gray-800/50 bg-gray-950/90 backdrop-blur-md sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-5 py-3.5 flex items-center justify-between">
          <div className="flex items-center gap-3 cursor-pointer select-none" onClick={handleLogoClick}>
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center border transition duration-300 ${
              masterMode ? "bg-red-900/60 border-red-700 glow-red" : "bg-blue-900/40 border-blue-800"
            }`}>
              <span className="text-xl">🐉</span>
            </div>
            <div>
              <h1 className="font-bold text-white leading-tight tracking-tight">Kingdom Guardian Pro</h1>
              <p className="text-xs text-gray-600">Call of Dragons — Sistema de Gestión Militar</p>
            </div>
          </div>

          <div className="flex items-center gap-4">
            <div className="hidden md:flex items-center gap-4 text-xs">
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${online ? "bg-green-400 pulse" : "bg-red-500"}`} />
                <span className={online ? "text-green-400" : "text-red-400"}>Bot {online ? "Online" : "Offline"}</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${connected ? "bg-green-400 pulse" : "bg-red-500"}`} />
                <span className={connected ? "text-green-400" : "text-red-400"}>DB {connected ? "OK" : "Error"}</span>
              </div>
            </div>
            {masterMode && (
              <span className="text-xs bg-red-900/40 text-red-300 border border-red-800 px-3 py-1 rounded-full flex items-center gap-1.5">
                <Icon name="eye" size={11}/> Modo Intel
              </span>
            )}
          </div>
        </div>
      </header>

      {/* ── Main Content ───────────────────────────────────────────────────── */}
      <main className="max-w-7xl mx-auto px-5 py-8">
        {/* Quick stats bar */}
        {!masterMode && (
          <div className="grid grid-cols-3 gap-3 mb-8">
            <div className="bg-gray-900/40 border border-gray-800 rounded-xl p-3 flex items-center gap-3">
              <span className="text-2xl">🐉</span>
              <div>
                <p className="text-xs text-gray-600">Servidores</p>
                <p className="font-bold text-white">{guilds.length}</p>
              </div>
            </div>
            <div className="bg-gray-900/40 border border-gray-800 rounded-xl p-3 flex items-center gap-3">
              <span className={`text-2xl ${online ? "":"opacity-40"}`}>🤖</span>
              <div>
                <p className="text-xs text-gray-600">Bot de Discord</p>
                <p className={`font-bold ${online ? "text-green-400":"text-red-400"}`}>{online?"En línea":"Offline"}</p>
              </div>
            </div>
            <div className="bg-gray-900/40 border border-gray-800 rounded-xl p-3 flex items-center gap-3">
              <span className="text-2xl">🗄️</span>
              <div>
                <p className="text-xs text-gray-600">Base de Datos</p>
                <p className={`font-bold ${connected ? "text-green-400":"text-red-400"}`}>{connected?"Conectada":"Error"}</p>
              </div>
            </div>
          </div>
        )}

        {/* Main Panel */}
        <div className={`bg-gray-900/30 border rounded-2xl p-6 backdrop-blur-sm ${
          masterMode ? "border-red-900/50" : "border-gray-800/60"
        }`}>
          {masterMode
            ? <MasterIntelPanel onLock={() => setMasterMode(false)} />
            : <PublicPanel guilds={guilds} />
          }
        </div>

        {/* Footer */}
        <div className="text-center mt-8 text-gray-800 text-xs space-y-1">
          <p>Kingdom Guardian Pro — Call of Dragons Leadership Assistant</p>
          <p>21 comandos slash · 3 schedulers activos · Multi-tenancy MongoDB</p>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
