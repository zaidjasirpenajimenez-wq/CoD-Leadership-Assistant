<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom Guardian Pro — Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

    * { box-sizing: border-box; }
    body { margin: 0; background: #060810; font-family: 'Segoe UI', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f1320; }
    ::-webkit-scrollbar-thumb { background: #2a3a5c; border-radius: 3px; }

      background-image:
        linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    @keyframes pulse-glow { 0%,100%{opacity:1} 50%{opacity:.4} }
    .pulse { animation: pulse-glow 2s infinite; }
    @keyframes slide-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .slide-in { animation: slide-in 0.25s ease forwards; }
    @keyframes fade-in { from{opacity:0} to{opacity:1} }
    .fade-in { animation: fade-in 0.2s ease forwards; }
    .heatmap-cell { transition: transform .15s; cursor:pointer; }
    .heatmap-cell:hover { transform: scale(1.15); z-index:10; }
    .glow-red  { box-shadow: 0 0 18px rgba(239,68,68,.25); }
    .glow-blue { box-shadow: 0 0 18px rgba(59,130,246,.25); }
    .glow-gold { box-shadow: 0 0 18px rgba(234,179,8,.25); }
    .glow-green{ box-shadow: 0 0 18px rgba(34,197,94,.25); }
    .glow-purple{box-shadow: 0 0 18px rgba(168,85,247,.25); }

    .tab-active::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:currentColor; border-radius:1px; }
    .pts-bar { transition: width .6s cubic-bezier(.4,0,.2,1); }
    tr:hover td { background: rgba(59,130,246,0.04); }
    .rank-1 { background: linear-gradient(90deg,rgba(234,179,8,.08),transparent); }
    .rank-2 { background: linear-gradient(90deg,rgba(156,163,175,.06),transparent); }
    .rank-3 { background: linear-gradient(90deg,rgba(180,83,9,.06),transparent); }
  </style>
</head>
<body class="min-h-screen text-gray-100 grid-bg">
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;
const BASE = window.location.origin;
const MASTER_KEY = "COD_MASTER_INTEL";

async function apiFetch(path, headers = {}) {
  try {
    const r = await fetch(BASE + path, { headers });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

function masterHeaders() {
  return { "x-master-key": MASTER_KEY };
}

// ── Utilities ────────────────────────────────────────────────────────────────
function timeAgo(dateStr) {
  if (!dateStr) return "Nunca";
  const d = new Date(dateStr);
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return "hace " + diff + "s";
  if (diff < 3600) return "hace " + Math.floor(diff / 60) + "min";
  if (diff < 86400) return "hace " + Math.floor(diff / 3600) + "h";
  return "hace " + Math.floor(diff / 86400) + "d";
}

function fmtNum(n) { return (n ?? 0).toLocaleString("es-ES"); }

function Icon({ name, size = 16, cls = "" }) {
  const d = ICONS[name] || "";
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      className={`inline-block shrink-0 ${cls}`}>
      <path d={d} />

  );
}

// ── Badge ────────────────────────────────────────────────────────────────────
function Badge({ type }) {
  const map = {
    ATTACK:       "bg-red-900/60 text-red-300 border-red-700",
    DEFENSE:      "bg-blue-900/60 text-blue-300 border-blue-700",
    ALERT:        "bg-yellow-900/60 text-yellow-300 border-yellow-700",
    NAP:          "bg-yellow-900/60 text-yellow-300 border-yellow-700",
    ALLY:         "bg-green-900/60 text-green-300 border-green-700",
    ENEMY:        "bg-red-900/60 text-red-300 border-red-700",
    BORDER:       "bg-blue-900/60 text-blue-300 border-blue-700",
    FALTA_GUERRA: "bg-red-900/60 text-red-300 border-red-700",
    AUSENCIA_EVENTO:"bg-orange-900/60 text-orange-300 border-orange-700",
    PENALIZACION: "bg-yellow-900/60 text-yellow-300 border-yellow-700",

  };
  const labels = {
    FALTA_GUERRA: "⚔️ Falta Guerra", AUSENCIA_EVENTO: "📅 Ausencia",
    PENALIZACION: "⚠️ Penalización", OTRO: "📋 Otro",

  return (

      {labels[type] ?? type}

}

// ── Stat Card ────────────────────────────────────────────────────────────────
function StatCard({ label, value, color = "blue", sub, icon }) {
  const border = { red:"border-red-600/50 glow-red", blue:"border-blue-500/50 glow-blue", gold:"border-yellow-500/50 glow-gold", green:"border-green-500/50 glow-green", purple:"border-purple-500/50 glow-purple" };
  const text   = { red:"text-red-400", blue:"text-blue-400", gold:"text-yellow-400", green:"text-green-400", purple:"text-purple-400" };
  return (
    <div className={`bg-gray-900/50 border ${border[color] ?? border.blue} rounded-xl p-5 slide-in backdrop-blur-sm`}>
      <div className="flex items-center justify-between mb-2">
        <p className="text-gray-500 text-xs uppercase tracking-widest">{label}</p>
        {icon && <span className="text-lg">{icon}</span>}
      </div>
      <p className={`text-3xl font-bold ${text[color] ?? text.blue}`}>{value ?? "—"}</p>
      {sub && <p className="text-gray-600 text-xs mt-1">{sub}</p>}
    </div>
  );
}

// ── Spinner ──────────────────────────────────────────────────────────────────
function Spinner() {
  return (
    <div className="text-center py-16 text-gray-600">
      <div className="text-4xl mb-3 pulse">⏳</div>
      <p className="text-sm">Cargando datos...</p>
    </div>
  );
}

// ── Empty State ───────────────────────────────────────────────────────────────
function Empty({ icon = "📡", msg }) {
  return (
    <div className="text-center py-12 text-gray-600">
      <div className="text-4xl mb-3">{icon}</div>
      <p className="text-sm">{msg}</p>
    </div>
  );
}

// ── Heatmap ──────────────────────────────────────────────────────────────────
function ConflictHeatmap({ intel }) {
  const grid = 10;
  const cells = {};
  intel.forEach(item => {
    const m = item.coords?.match(/(\d+)[:\s,xX](\d+)/);
    if (m) {
      const cx = Math.floor((parseInt(m[1]) % 1000) / 100);
      const cy = Math.floor((parseInt(m[2]) % 1000) / 100);
      const key = `${cx},${cy}`;
      cells[key] = (cells[key] || 0) + 1;
    }
  });
  const maxVal = Math.max(...Object.values(cells), 1);
  return (
    <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-5">
      <h3 className="text-sm font-semibold text-gray-300 mb-4 flex items-center gap-2">
        <span className="w-2 h-2 bg-red-500 rounded-full pulse" />
        Mapa de Calor — Zonas de Conflicto
      </h3>
      <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${grid}, 1fr)` }}>
        {Array.from({ length: grid * grid }, (_, i) => {
          const x = i % grid, y = Math.floor(i / grid);
          const count = cells[`${x},${y}`] || 0;
          const intensity = count / maxVal;
          const alpha = Math.round(intensity * 200).toString(16).padStart(2, "0");
          const bg = count > 0 ? `#ef4444${alpha}` : "#111827";
          return (
            <div key={i} className="heatmap-cell rounded aspect-square"
              style={{ background: bg, minWidth: 0 }}
              title={count > 0 ? `Zona (${x*100}:${y*100}) — ${count} evento${count>1?"s":""}` : ""} />
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4 text-xs text-gray-600">
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-gray-800 inline-block"/>Sin actividad</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-red-800/60 inline-block"/>Media</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-red-500 inline-block"/>Alta</span>
      </div>
    </div>
  );
}

// ── Leaderboard Table ─────────────────────────────────────────────────────────
function LeaderboardTable({ members, scoreKey = "weeklyPoints", label = "Pts Semana" }) {
  const max = members[0]?.[scoreKey] || 1;
  const medals = ["🥇", "🥈", "🥉"];
  const rowCls = ["rank-1","rank-2","rank-3"];
  if (!members.length) return <Empty icon="🏆" msg="No hay datos de ranking aún" />;
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-xs text-gray-500 uppercase border-b border-gray-800">
            <th className="text-left py-2 pr-3 w-8">#</th>
            <th className="text-left py-2 pr-3">Soldado</th>
            <th className="text-right py-2 pr-3">{label}</th>
            <th className="text-right py-2 pr-3 hidden sm:table-cell">Total</th>
            <th className="text-right py-2 hidden sm:table-cell">Eventos</th>
            <th className="py-2 pl-4 w-32 hidden md:table-cell">Actividad</th>
          </tr>
        </thead>
        <tbody>
          {members.map((m, i) => (
            <tr key={i} className={`border-b border-gray-900/60 transition ${rowCls[i] ?? ""}`}>
              <td className="py-2.5 pr-3 text-lg">{medals[i] ?? <span className="text-gray-600 text-xs font-mono">{i+1}</span>}</td>
              <td className="py-2.5 pr-3">
                <span className="font-semibold text-white">{m.ign || "Soldado"}</span>
                <span className="text-gray-600 text-xs ml-2 font-mono hidden sm:inline">#{m.discordId?.slice(-4)}</span>
              </td>
              <td className="py-2.5 pr-3 text-right font-bold text-blue-400">{fmtNum(m[scoreKey])}</td>
              <td className="py-2.5 pr-3 text-right text-gray-500 hidden sm:table-cell">{fmtNum(m.totalPoints)}</td>
              <td className="py-2.5 text-right text-gray-500 hidden sm:table-cell">{m.eventsAttended ?? 0}</td>
              <td className="py-2.5 pl-4 hidden md:table-cell">
                <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden w-full">
                  <div className="pts-bar h-full bg-gradient-to-r from-blue-600 to-blue-400 rounded-full"
                    style={{ width: `${Math.round((m[scoreKey] / max) * 100)}%` }} />
                </div>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── KVK Table ─────────────────────────────────────────────────────────────────
function KvkTable({ records, guildMap }) {
  const medals = ["🥇","🥈","🥉"];
  if (!records.length) return <Empty icon="⚔️" msg="Sin registros KVK aún" />;
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-xs text-gray-500 uppercase border-b border-gray-800">
            <th className="text-left py-2 pr-2 w-8">#</th>
            <th className="text-left py-2 pr-3">Soldado</th>
            <th className="text-left py-2 pr-3 hidden sm:table-cell">Alianza</th>
            <th className="text-left py-2 pr-3 hidden md:table-cell">Temporada</th>
            <th className="text-right py-2 pr-3">⚔️ Kills</th>
            <th className="text-right py-2 pr-3 hidden sm:table-cell">💀 Muertes</th>
            <th className="text-right py-2 pr-3 hidden md:table-cell">💥 Poder</th>
            <th className="text-right py-2">🏆 Score</th>
          </tr>
        </thead>
        <tbody>
          {records.map((r, i) => (
            <tr key={i} className={`border-b border-gray-900/60 transition ${["rank-1","rank-2","rank-3"][i] ?? ""}`}>
              <td className="py-2.5 pr-2 text-lg">{medals[i] ?? <span className="text-gray-600 text-xs font-mono">{i+1}</span>}</td>
              <td className="py-2.5 pr-3">
                <span className="font-semibold text-white font-mono text-xs">{r.discordId?.slice(-8)}</span>
              </td>
              <td className="py-2.5 pr-3 text-gray-400 hidden sm:table-cell">{guildMap?.[r.guildId] ?? "—"}</td>
              <td className="py-2.5 pr-3 text-gray-500 hidden md:table-cell">{r.seasonName}</td>
              <td className="py-2.5 pr-3 text-right text-red-400 font-semibold">{fmtNum(r.kills)}</td>
              <td className="py-2.5 pr-3 text-right text-gray-500 hidden sm:table-cell">{fmtNum(r.deaths)}</td>
              <td className="py-2.5 pr-3 text-right text-purple-400 hidden md:table-cell">{fmtNum(r.powerDestroyed)}</td>
              <td className="py-2.5 text-right text-yellow-400 font-bold">{fmtNum(Math.round(r.score))}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── Sanctions Table ───────────────────────────────────────────────────────────
function SanctionsTable({ sanctions, guildMap }) {
  if (!sanctions.length) return <Empty icon="📋" msg="Sin sanciones registradas" />;
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-xs text-gray-500 uppercase border-b border-gray-800">
            <th className="text-left py-2 pr-3">Tipo</th>
            <th className="text-left py-2 pr-3">Soldado</th>
            <th className="text-left py-2 pr-3 hidden md:table-cell">Alianza</th>
            <th className="text-left py-2 pr-3">Motivo</th>
            <th className="text-right py-2">Fecha</th>
          </tr>
        </thead>
        <tbody>
          {sanctions.map((s, i) => (
            <tr key={i} className="border-b border-gray-900/60 transition">
              <td className="py-2.5 pr-3"><Badge type={s.type} /></td>
              <td className="py-2.5 pr-3 font-mono text-xs text-gray-400">{s.discordId?.slice(-8)}</td>
              <td className="py-2.5 pr-3 text-gray-500 hidden md:table-cell">{guildMap?.[s.guildId] ?? "—"}</td>
              <td className="py-2.5 pr-3 text-gray-300 max-w-[200px] truncate" title={s.reason}>{s.reason}</td>
              <td className="py-2.5 text-right text-gray-600 text-xs whitespace-nowrap">{timeAgo(s.createdAt)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── Inactivity Table ──────────────────────────────────────────────────────────
function InactivityTable({ inactive, guildMap }) {
  if (!inactive.length) return (
    <div className="text-center py-12">
      <div className="text-4xl mb-3">✅</div>
      <p className="text-green-400 font-semibold">Sin inactivos detectados</p>
      <p className="text-gray-600 text-sm mt-1">Todos los miembros tienen actividad reciente</p>
    </div>
  );
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-xs text-gray-500 uppercase border-b border-gray-800">
            <th className="text-left py-2 pr-3">IGN</th>
            <th className="text-left py-2 pr-3 hidden sm:table-cell">Alianza</th>
            <th className="text-right py-2 pr-3">Pts Semana</th>
            <th className="text-right py-2">Última Actividad</th>
          </tr>
        </thead>
        <tbody>
          {inactive.map((m, i) => {
            const daysAgo = Math.floor((Date.now() - new Date(m.lastActivity).getTime()) / 86400000);
            const severity = daysAgo > 14 ? "text-red-400" : daysAgo > 7 ? "text-orange-400" : "text-yellow-400";
            return (
              <tr key={i} className="border-b border-gray-900/60 transition">
                <td className="py-2.5 pr-3">
                  <span className="text-white font-medium">{m.ign || "Sin IGN"}</span>
                  <span className="text-gray-600 text-xs ml-2 font-mono hidden sm:inline">#{m.discordId?.slice(-4)}</span>
                </td>
                <td className="py-2.5 pr-3 text-gray-500 hidden sm:table-cell">{guildMap?.[m.guildId] ?? "—"}</td>
                <td className="py-2.5 pr-3 text-right text-gray-500">{m.weeklyPoints ?? 0}</td>
                <td className={`py-2.5 text-right font-semibold ${severity}`}>{timeAgo(m.lastActivity)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Tabs Component ────────────────────────────────────────────────────────────
function Tabs({ tabs, active, onChange, color = "blue" }) {
  const activeColor = { blue:"text-blue-400", red:"text-red-400" };
  return (
    <div className="flex gap-0.5 mb-5 bg-gray-900/60 p-1 rounded-xl border border-gray-800/60 overflow-x-auto">
      {tabs.map(t => (
        <button key={t.id} onClick={() => onChange(t.id)}
          className={`flex-shrink-0 flex items-center gap-1.5 text-xs py-2 px-3 rounded-lg transition-all font-medium whitespace-nowrap ${
            active === t.id
              ? (color === "red" ? "bg-red-900/50 text-red-200 border border-red-800" : "bg-blue-900/40 text-blue-200 border border-blue-800")
              : "text-gray-500 hover:text-gray-300 hover:bg-gray-800/40"
          }`}>
          {t.icon && <span>{t.icon}</span>}
          {t.label}
        </button>
      ))}
    </div>
  );
}

// ── Master Intel Panel ────────────────────────────────────────────────────────
function MasterIntelPanel({ onLock }) {
  const [tab, setTab] = useState("overview");
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState({
    overview: null, intel: [], diplomacy: { pacts: [], guildMap: {} },
    members: [], sanctions: { sanctions: [], guildMap: {} },
    kvk: { records: [], guildMap: {} }, inactivity: { inactive: [], guildMap: {} },
  });

  useEffect(() => {
    const h = masterHeaders();
    Promise.all([
      apiFetch("/api/dashboard/overview", h),
      apiFetch("/api/dashboard/intel", h),
      apiFetch("/api/dashboard/diplomacy", h),
      apiFetch("/api/dashboard/members", h),
      apiFetch("/api/dashboard/sanctions", h),
      apiFetch("/api/dashboard/kvk", h),
      apiFetch("/api/dashboard/inactivity", h),
    ]).then(([overview, intelRes, dipRes, membersRes, sanctRes, kvkRes, inactRes]) => {
      setData({
        overview,
        intel: intelRes?.intel ?? [],
        diplomacy: dipRes ?? { pacts: [], guildMap: {} },
        members: membersRes?.members ?? [],
        sanctions: sanctRes ?? { sanctions: [], guildMap: {} },
        kvk: kvkRes ?? { records: [], guildMap: {} },
        inactivity: inactRes ?? { inactive: [], guildMap: {} },
      });
      setLoading(false);
    });
  }, []);

  const TABS = [
    { id:"overview",   icon:"📊", label:"Resumen" },
    { id:"leaderboard",icon:"🏆", label:"Ranking" },
    { id:"kvk",        icon:"⚔️", label:"KVK" },
    { id:"sanctions",  icon:"⚠️", label:"Sanciones" },
    { id:"inactivity", icon:"👻", label:"Inactividad" },
    { id:"intel",      icon:"🛰️", label:"Intel Global" },
    { id:"heatmap",    icon:"🌡️", label:"Mapa de Calor" },
    { id:"diplomacy",  icon:"🤝", label:"Diplomacia" },
    { id:"roster",     icon:"👥", label:"Roster" },
  ];

  const { overview, intel, diplomacy, members, sanctions, kvk, inactivity } = data;
  const weeklyTop = useMemo(() =>
    [...members].sort((a,b) => (b.weeklyPoints||0)-(a.weeklyPoints||0)).slice(0,20), [members]);
  const totalTop = useMemo(() =>
    [...members].sort((a,b) => (b.totalPoints||0)-(a.totalPoints||0)).slice(0,20), [members]);

  return (
    <div className="slide-in">
      {/* Header */}
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 bg-red-900/50 border border-red-700 rounded-xl flex items-center justify-center">
            <span className="text-xl">👁️</span>
          </div>
          <div>
            <h2 className="text-xl font-bold text-red-400">RADAR DE INTELIGENCIA MAESTRA</h2>
            <p className="text-xs text-gray-600">Acceso maestro — Vista global multi-servidor</p>
          </div>
        </div>
        <button onClick={onLock}
          className="text-xs text-gray-600 hover:text-red-400 border border-gray-800 hover:border-red-800 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
          <Icon name="lock" size={12} /> Bloquear
        </button>
      </div>

      <Tabs tabs={TABS} active={tab} onChange={setTab} color="red" />

      {loading ? <Spinner /> : (
        <div className="fade-in">
          {/* OVERVIEW */}
          {tab === "overview" && (
            <div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <StatCard label="Total Soldados" value={fmtNum(overview?.totalMembers)} color="blue" icon="👥" />
                <StatCard label="Activos Esta Semana" value={fmtNum(overview?.activeMembers)} color="green"
                  sub={overview?.totalMembers ? `${Math.round((overview.activeMembers/overview.totalMembers)*100)}% de participación` : ""} icon="⚡" />
                <StatCard label="Inactivos +7d" value={fmtNum(overview?.inactiveMembers)} color="red" icon="👻" />
                <StatCard label="Sanciones Este Mes" value={fmtNum(overview?.sanctionsMonth)} color="gold" icon="⚠️" />
              </div>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                <StatCard label="Sanciones Totales" value={fmtNum(overview?.totalSanctions)} color="red" icon="📋" />
                <StatCard label="Pactos Diplomáticos" value={fmtNum(overview?.totalPacts)} color="blue" icon="🤝" />
                <StatCard label="Registros Intel" value={fmtNum(overview?.totalIntel)} color="purple" icon="🛰️" />
              </div>
            </div>
          )}

          {/* RANKING */}
          {tab === "leaderboard" && (
            <div>
              <div className="grid grid-cols-2 gap-2 mb-4 bg-gray-900/40 p-1 rounded-lg border border-gray-800">
                {["weekly","total"].map(k => (
                  <button key={k} id={`lb-${k}`} onClick={() => {
                    document.querySelectorAll(".lb-btn").forEach(el => el.classList.remove("bg-blue-900/40","text-blue-200","border","border-blue-800"));
                    document.getElementById(`lb-${k}`).classList.add("bg-blue-900/40","text-blue-200","border","border-blue-800");
                    document.getElementById("lb-weekly").style.display = k==="weekly"?"block":"none";
                    document.getElementById("lb-total").style.display = k==="total"?"block":"none";
                  }} className={`lb-btn text-xs py-2 px-3 rounded-md font-medium transition ${k==="weekly"?"bg-blue-900/40 text-blue-200 border border-blue-800":"text-gray-500"}`}>
                    {k==="weekly" ? "⭐ Semanal" : "🏆 Histórico"}
                  </button>
                ))}
              </div>
              <div id="lb-weekly"><LeaderboardTable members={weeklyTop} scoreKey="weeklyPoints" label="Pts Semana" /></div>
              <div id="lb-total" style={{display:"none"}}><LeaderboardTable members={totalTop} scoreKey="totalPoints" label="Pts Total" /></div>
            </div>
          )}

          {/* KVK */}
          {tab === "kvk" && <KvkTable records={kvk.records} guildMap={kvk.guildMap} />}

          {/* SANCIONES */}
          {tab === "sanctions" && <SanctionsTable sanctions={sanctions.sanctions} guildMap={sanctions.guildMap} />}

          {/* INACTIVIDAD */}
          {tab === "inactivity" && <InactivityTable inactive={inactivity.inactive} guildMap={inactivity.guildMap} />}

          {/* INTEL GLOBAL */}
          {tab === "intel" && (
            <div className="space-y-2 max-h-[520px] overflow-y-auto pr-1">
              {!intel.length && <Empty icon="📡" msg="Sin datos de inteligencia aún" />}
              {intel.map((item, i) => (
                <div key={i} className="bg-gray-900/50 border border-gray-800 rounded-lg p-3 flex items-start gap-3 hover:border-gray-700 transition">
                  <Badge type={item.actionType} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-xs font-mono text-yellow-400">{item.coords}</span>
                      <span className="text-xs text-gray-600 shrink-0">{new Date(item.timestamp).toLocaleString("es-ES")}</span>
                    </div>
                    <p className="text-sm text-gray-300 mt-0.5 truncate">{item.details}</p>
                    <p className="text-xs text-gray-600 mt-0.5">Alianza: <span className="text-gray-400">{item.allianceTag}</span></p>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* HEATMAP */}
          {tab === "heatmap" && <ConflictHeatmap intel={intel} />}

          {/* DIPLOMACIA */}
          {tab === "diplomacy" && (
            <div className="space-y-2 max-h-[520px] overflow-y-auto pr-1">
              {!diplomacy.pacts.length && <Empty icon="🤝" msg="Sin pactos diplomáticos registrados" />}
              {diplomacy.pacts.map((pact, i) => (
                <div key={i} className="bg-gray-900/50 border border-gray-800 rounded-lg p-3 flex items-center gap-3 hover:border-gray-700 transition">
                  <Badge type={pact.pactType} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between gap-2">
                      <span className="font-semibold text-sm text-white">{pact.targetAlliance}</span>
                      <span className="text-xs text-gray-600 shrink-0">{diplomacy.guildMap[pact.guildId] ?? pact.guildId}</span>
                    </div>
                    {pact.details && <p className="text-xs text-gray-500 mt-0.5">{pact.details}</p>}
                    {pact.expiresAt && (
                      <p className="text-xs text-orange-400 mt-0.5">⏳ Vence: {new Date(pact.expiresAt).toLocaleDateString("es-ES")}</p>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ROSTER */}
          {tab === "roster" && (
            <div className="overflow-x-auto max-h-[520px] overflow-y-auto">
              <table className="w-full text-sm">
                <thead className="sticky top-0 bg-gray-950/90 backdrop-blur-sm">
                  <tr className="text-xs text-gray-500 uppercase border-b border-gray-800">
                    <th className="text-left py-2 pr-3">IGN</th>
                    <th className="text-right py-2 pr-3 hidden sm:table-cell">Poder</th>
                    <th className="text-right py-2 pr-3">Pts Semana</th>
                    <th className="text-right py-2 pr-3 hidden md:table-cell">Pts Total</th>
                    <th className="text-center py-2">Warns</th>
                  </tr>
                </thead>
                <tbody>
                  {!members.length && <tr><td colSpan="5"><Empty icon="👥" msg="Sin miembros registrados" /></td></tr>}
                  {members.map((m, i) => (
                    <tr key={i} className="border-b border-gray-900/60 transition">
                      <td className="py-2 pr-3">
                        <span className="font-medium text-white">{m.ign || "—"}</span>
                        <span className="text-gray-600 text-xs ml-2 font-mono">#{m.discordId?.slice(-4)}</span>
                      </td>
                      <td className="py-2 pr-3 text-right text-blue-400 hidden sm:table-cell">{m.power ? fmtNum(m.power) : "—"}</td>
                      <td className="py-2 pr-3 text-right text-yellow-400 font-semibold">{fmtNum(m.weeklyPoints)}</td>
                      <td className="py-2 pr-3 text-right text-gray-500 hidden md:table-cell">{fmtNum(m.totalPoints)}</td>
                      <td className="py-2 text-center">
                        <span className={`text-xs font-bold ${m.warns > 0 ? "text-red-400" : "text-gray-700"}`}>{m.warns}/3</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Public Alliance Panel ─────────────────────────────────────────────────────
function PublicPanel({ guilds }) {
  const [selected, setSelected] = useState(null);
  const [guildData, setGuildData] = useState(null);
  const [leaderboard, setLeaderboard] = useState(null);
  const [loading, setLoading] = useState(false);
  const [tab, setTab] = useState("stats");

  useEffect(() => {
    if (!selected) return;
    setLoading(true);
    setGuildData(null);
    setLeaderboard(null);
    setTab("stats");
    Promise.all([
      apiFetch(`/api/dashboard/guilds/${selected}`),
      apiFetch(`/api/dashboard/guilds/${selected}/leaderboard`),
    ]).then(([gd, lb]) => {
      setGuildData(gd);
      setLeaderboard(lb);
      setLoading(false);
    });
  }, [selected]);

  const TABS = [
    { id:"stats",      icon:"📊", label:"Estadísticas" },
    { id:"leaderboard",icon:"🏆", label:"Ranking Semanal" },
    { id:"alltime",    icon:"⭐", label:"Hall of Fame" },
    { id:"diplomacy",  icon:"🛰️", label:"Diplomacia" },
  ];

  return (
    <div className="slide-in">
      <div className="mb-6">
        <h2 className="text-lg font-bold text-gray-200 mb-1">Seleccionar Servidor</h2>
        <p className="text-xs text-gray-600">Selecciona una alianza para ver sus estadísticas y ranking</p>
      </div>

      {guilds.length === 0 ? (
        <div className="text-center py-16 text-gray-600">
          <div className="text-4xl mb-3">🏰</div>
          <p>No hay servidores registrados aún</p>
          <p className="text-xs mt-2">Configura el bot con <code className="bg-gray-800 px-1.5 py-0.5 rounded text-gray-400">/setup alliance</code></p>
        </div>
      ) : (
        <>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mb-6">
            {guilds.map(g => (
              <button key={g.guildId} onClick={() => setSelected(g.guildId)}
                className={`p-4 rounded-xl border text-left transition ${
                  selected === g.guildId
                    ? "border-blue-500 bg-blue-900/20 glow-blue"
                    : "border-gray-800 bg-gray-900/40 hover:border-gray-700"
                }`}>
                <p className="font-bold text-white text-lg">[{g.allianceTag}]</p>
                <p className="text-xs text-gray-600 mt-1 truncate">ID: {g.guildId}</p>
              </button>
            ))}
          </div>

          {loading && <Spinner />}

          {guildData && !loading && (
            <div className="slide-in">
              <Tabs tabs={TABS} active={tab} onChange={setTab} color="blue" />

              {tab === "stats" && (
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <StatCard label="Miembros Registrados" value={fmtNum(guildData.memberCount)} color="blue" icon="👥" />
                  <StatCard label="Activos Esta Semana" value={fmtNum(guildData.activeCount)} color="green"
                    sub={guildData.memberCount ? `${Math.round((guildData.activeCount/guildData.memberCount)*100)}% participación` : ""} icon="⚡" />
                  <StatCard label="Con Advertencias" value={fmtNum(guildData.warnedCount)} color="red" icon="⚠️" />
                  <StatCard label="Pactos Diplomáticos" value={fmtNum(guildData.pacts?.length)} color="gold" icon="🤝" />
                </div>
              )}

              {tab === "leaderboard" && (
                <div>
                  <div className="flex items-center gap-2 mb-4">
                    <div className="w-2 h-2 bg-blue-500 rounded-full pulse" />
                    <span className="text-sm text-gray-400">Top 20 soldados más activos de la semana</span>
                  </div>
                  <LeaderboardTable members={leaderboard?.weekly ?? []} scoreKey="weeklyPoints" label="Pts Semana" />
                </div>
              )}

              {tab === "alltime" && (
                <div>
                  <div className="flex items-center gap-2 mb-4">
                    <span className="text-sm text-gray-400">🏆 Ranking histórico — Hall of Fame de la alianza</span>
                  </div>
                  <LeaderboardTable members={leaderboard?.allTime ?? []} scoreKey="totalPoints" label="Pts Total" />
                </div>
              )}

              {tab === "diplomacy" && (
                <div className="space-y-2">
                  {!guildData.pacts?.length && <Empty icon="🤝" msg="Sin pactos diplomáticos registrados" />}
                  {guildData.pacts?.map((p, i) => (
                    <div key={i} className="bg-gray-900/50 border border-gray-800 rounded-lg p-3 flex items-center gap-3 hover:border-gray-700 transition">
                      <Badge type={p.pactType} />
                      <div className="flex-1">
                        <span className="font-semibold text-sm text-white">{p.targetAlliance}</span>
                        {p.details && <span className="text-xs text-gray-500 ml-2">— {p.details}</span>}
                        {p.expiresAt && (
                          <div className="text-xs text-orange-400 mt-0.5">⏳ Vence: {new Date(p.expiresAt).toLocaleDateString("es-ES")}</div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Master Key Modal ──────────────────────────────────────────────────────────
function MasterKeyModal({ onSubmit, onClose }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);
  const submit = () => {
    if (val === MASTER_KEY) { onSubmit(); }
    else { setErr(true); setTimeout(() => setErr(false), 1500); }
  };
  return (
    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50" onClick={onClose}>
      <div className="bg-gray-900 border border-red-900 rounded-2xl p-8 w-full max-w-sm shadow-2xl slide-in" onClick={e => e.stopPropagation()}>
        <div className="text-center mb-6">
          <div className="text-5xl mb-3">🔐</div>
          <h2 className="text-xl font-bold text-red-400">Acceso Restringido</h2>
          <p className="text-xs text-gray-600 mt-1">Introduce la clave de acceso maestra</p>
        </div>
        <input type="password" value={val} onChange={e => setVal(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()}
          placeholder="Clave de acceso..."
          className={`w-full bg-gray-800 border rounded-xl px-4 py-3 text-sm text-white placeholder-gray-700 outline-none focus:ring-1 transition ${err ? "border-red-500 focus:ring-red-500" : "border-gray-700 focus:ring-red-700"}`}
          autoFocus />
        {err && <p className="text-red-400 text-xs mt-2 text-center">⚠️ Clave incorrecta</p>}
        <button onClick={submit} className="mt-4 w-full bg-red-800 hover:bg-red-700 text-white font-semibold py-2.5 rounded-xl transition">
          Acceder
        </button>
        <button onClick={onClose} className="mt-2 w-full text-gray-700 hover:text-gray-500 text-sm py-1.5 transition">
          Cancelar
        </button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [health, setHealth] = useState(null);
  const [guilds, setGuilds] = useState([]);
  const [masterMode, setMasterMode] = useState(false);
  const [showModal, setShowModal] = useState(false);
  const logoClickCount = useRef(0);
  const logoTimer = useRef(null);

  useEffect(() => {
    apiFetch("/api/healthz").then(h => setHealth(h));
    apiFetch("/api/dashboard/guilds").then(d => setGuilds(d?.guilds ?? []));
  }, []);

  const handleLogoClick = () => {
    logoClickCount.current += 1;
    clearTimeout(logoTimer.current);
    logoTimer.current = setTimeout(() => { logoClickCount.current = 0; }, 3000);
    if (logoClickCount.current >= 5) { logoClickCount.current = 0; setShowModal(true); }
  };

  const online  = health?.discord === "online";
  const connected = health?.mongo === "connected";

  return (
    <div className="min-h-screen">
      {showModal && !masterMode && (
        <MasterKeyModal onSubmit={() => { setMasterMode(true); setShowModal(false); }} onClose={() => setShowModal(false)} />
      )}

      {/* ── Header ─────────────────────────────────────────────────────────── */}
      <header className="border-b border-gray-800/50 bg-gray-950/90 backdrop-blur-md sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-5 py-3.5 flex items-center justify-between">
          <div className="flex items-center gap-3 cursor-pointer select-none" onClick={handleLogoClick}>
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center border transition duration-300 ${
              masterMode ? "bg-red-900/60 border-red-700 glow-red" : "bg-blue-900/40 border-blue-800"
            }`}>
              <span className="text-xl">🐉</span>
            </div>
            <div>
              <h1 className="font-bold text-white leading-tight tracking-tight">Kingdom Guardian Pro</h1>
              <p className="text-xs text-gray-600">Call of Dragons — Sistema de Gestión Militar</p>
            </div>
          </div>

          <div className="flex items-center gap-4">
            <div className="hidden md:flex items-center gap-4 text-xs">
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${online ? "bg-green-400 pulse" : "bg-red-500"}`} />
                <span className={online ? "text-green-400" : "text-red-400"}>Bot {online ? "Online" : "Offline"}</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${connected ? "bg-green-400 pulse" : "bg-red-500"}`} />
                <span className={connected ? "text-green-400" : "text-red-400"}>DB {connected ? "OK" : "Error"}</span>
              </div>
            </div>
            {masterMode && (
              <span className="text-xs bg-red-900/40 text-red-300 border border-red-800 px-3 py-1 rounded-full flex items-center gap-1.5">
                <Icon name="eye" size={11}/> Modo Intel
              </span>
            )}
          </div>
        </div>
      </header>

      {/* ── Main Content ───────────────────────────────────────────────────── */}
      <main className="max-w-7xl mx-auto px-5 py-8">
        {/* Quick stats bar */}
        {!masterMode && (
          <div className="grid grid-cols-3 gap-3 mb-8">
            <div className="bg-gray-900/40 border border-gray-800 rounded-xl p-3 flex items-center gap-3">
              <span className="text-2xl">🐉</span>
              <div>
                <p className="text-xs text-gray-600">Servidores</p>
                <p className="font-bold text-white">{guilds.length}</p>
              </div>
            </div>
            <div className="bg-gray-900/40 border border-gray-800 rounded-xl p-3 flex items-center gap-3">
              <span className={`text-2xl ${online ? "":"opacity-40"}`}>🤖</span>
              <div>
                <p className="text-xs text-gray-600">Bot de Discord</p>
                <p className={`font-bold ${online ? "text-green-400":"text-red-400"}`}>{online?"En línea":"Offline"}</p>
              </div>
            </div>
            <div className="bg-gray-900/40 border border-gray-800 rounded-xl p-3 flex items-center gap-3">
              <span className="text-2xl">🗄️</span>
              <div>
                <p className="text-xs text-gray-600">Base de Datos</p>
                <p className={`font-bold ${connected ? "text-green-400":"text-red-400"}`}>{connected?"Conectada":"Error"}</p>
              </div>
            </div>
          </div>
        )}

        {/* Main Panel */}
        <div className={`bg-gray-900/30 border rounded-2xl p-6 backdrop-blur-sm ${
          masterMode ? "border-red-900/50" : "border-gray-800/60"
        }`}>
          {masterMode
            ? <MasterIntelPanel onLock={() => setMasterMode(false)} />
            : <PublicPanel guilds={guilds} />
          }
        </div>

        {/* Footer */}
        <div className="text-center mt-8 text-gray-800 text-xs space-y-1">
          <p>Kingdom Guardian Pro — Call of Dragons Leadership Assistant</p>
          <p>21 comandos slash · 3 schedulers activos · Multi-tenancy MongoDB</p>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
