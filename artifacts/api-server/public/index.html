<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom Guardian Pro — Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0c14; font-family: 'Segoe UI', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f1320; }
    ::-webkit-scrollbar-thumb { background: #3b4a6b; border-radius: 3px; }
    .glow-red { box-shadow: 0 0 20px rgba(239,68,68,0.3); }
    .glow-blue { box-shadow: 0 0 20px rgba(59,130,246,0.3); }
    .glow-gold { box-shadow: 0 0 20px rgba(234,179,8,0.3); }
    .glow-green { box-shadow: 0 0 20px rgba(34,197,94,0.3); }
    .grid-bg {
      background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse { animation: pulse-glow 2s infinite; }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slide-in 0.3s ease forwards; }
    .heatmap-cell { transition: all 0.2s; }
    .heatmap-cell:hover { transform: scale(1.1); z-index: 10; }
  </style>
</head>
<body class="min-h-screen text-gray-100 grid-bg">

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const BASE = window.location.origin;

async function apiFetch(path, headers = {}) {
  try {
    const r = await fetch(BASE + path, { headers });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

// ── Icons (via Lucide) ───────────────────────────────────────────────────────
function Icon({ name, size = 16, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && lucide) {
      ref.current.innerHTML = "";
      const icon = lucide[name];
      if (icon) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        el.setAttribute("width", size);
        el.setAttribute("height", size);
        el.setAttribute("viewBox", "0 0 24 24");
        el.setAttribute("fill", "none");
        el.setAttribute("stroke", "currentColor");
        el.setAttribute("stroke-width", "2");
        el.setAttribute("stroke-linecap", "round");
        el.setAttribute("stroke-linejoin", "round");
        el.className = className;
        el.innerHTML = icon[2].map(([tag, attrs]) => {
          const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
          Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
          return e.outerHTML;
        }).join("");
        ref.current.appendChild(el);
      }
    }
  }, [name, size]);
  return <span ref={ref} className={`inline-flex ${className}`} />;
}

// ── Stat Card ─────────────────────────────────────────────────────────────────
function StatCard({ label, value, color = "blue", sub }) {
  const colors = {
    red: "border-red-600 glow-red",
    blue: "border-blue-500 glow-blue",
    gold: "border-yellow-500 glow-gold",
    green: "border-green-500 glow-green",
  };
  const textColors = { red: "text-red-400", blue: "text-blue-400", gold: "text-yellow-400", green: "text-green-400" };
  return (
    <div className={`bg-gray-900/60 border ${colors[color]} rounded-xl p-5 slide-in`}>
      <p className="text-gray-400 text-xs uppercase tracking-widest mb-1">{label}</p>
      <p className={`text-3xl font-bold ${textColors[color]}`}>{value ?? "—"}</p>
      {sub && <p className="text-gray-500 text-xs mt-1">{sub}</p>}
    </div>
  );
}

// ── Badge ─────────────────────────────────────────────────────────────────────
function Badge({ type }) {
  const styles = {
    ATTACK:  "bg-red-900/60 text-red-300 border border-red-700",
    DEFENSE: "bg-blue-900/60 text-blue-300 border border-blue-700",
    ALERT:   "bg-yellow-900/60 text-yellow-300 border border-yellow-700",
    NAP:     "bg-yellow-900/60 text-yellow-300 border border-yellow-700",
    ALLY:    "bg-green-900/60 text-green-300 border border-green-700",
    ENEMY:   "bg-red-900/60 text-red-300 border border-red-700",
    BORDER:  "bg-blue-900/60 text-blue-300 border border-blue-700",
  };
  return (
    <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${styles[type] ?? "bg-gray-800 text-gray-300"}`}>
      {type}
    </span>
  );
}

// ── Heatmap ───────────────────────────────────────────────────────────────────
function ConflictHeatmap({ intel }) {
  const grid = 10;
  const cells = {};
  intel.forEach(item => {
    const m = item.coords?.match(/(\d+)[:\s,xX](\d+)/);
    if (m) {
      const cx = Math.floor((parseInt(m[1]) % 1000) / 100);
      const cy = Math.floor((parseInt(m[2]) % 1000) / 100);
      const key = `${cx},${cy}`;
      cells[key] = (cells[key] || 0) + 1;
    }
  });
  const maxVal = Math.max(...Object.values(cells), 1);

  return (
    <div className="bg-gray-900/60 border border-gray-700 rounded-xl p-4">
      <h3 className="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
        <span className="w-2 h-2 bg-red-500 rounded-full pulse" />
        Mapa de Calor — Zonas de Conflicto
      </h3>
      <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${grid}, 1fr)` }}>
        {Array.from({ length: grid * grid }, (_, i) => {
          const x = i % grid;
          const y = Math.floor(i / grid);
          const count = cells[`${x},${y}`] || 0;
          const intensity = count / maxVal;
          const alpha = Math.round(intensity * 255).toString(16).padStart(2, "0");
          const bg = count > 0 ? `#ef4444${alpha}` : "#1f2937";
          return (
            <div
              key={i}
              className="heatmap-cell rounded aspect-square cursor-pointer"
              style={{ background: bg, minWidth: 0 }}
              title={count > 0 ? `Zona (${x * 100}:${y * 100}) — ${count} evento${count > 1 ? "s" : ""}` : ""}
            />
          );
        })}
      </div>
      <div className="flex items-center gap-2 mt-3 text-xs text-gray-500">
        <div className="w-3 h-3 rounded bg-gray-700" /> Sin actividad
        <div className="w-3 h-3 rounded bg-red-700/50" /> Media
        <div className="w-3 h-3 rounded bg-red-500" /> Alta
      </div>
    </div>
  );
}

// ── Master Intel Panel ────────────────────────────────────────────────────────
function MasterIntelPanel({ onLock }) {
  const [intel, setIntel] = useState([]);
  const [diplomacy, setDiplomacy] = useState({ pacts: [], guildMap: {} });
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("intel");

  useEffect(() => {
    const headers = { "x-master-key": "COD_MASTER_INTEL" };
    Promise.all([
      apiFetch("/api/dashboard/intel", headers),
      apiFetch("/api/dashboard/diplomacy", headers),
      apiFetch("/api/dashboard/members", headers),
    ]).then(([i, d, m]) => {
      setIntel(i?.intel ?? []);
      setDiplomacy(d ?? { pacts: [], guildMap: {} });
      setMembers(m?.members ?? []);
      setLoading(false);
    });
  }, []);

  const tabs = [
    { id: "intel", label: "⚔️ Intel Global" },
    { id: "heatmap", label: "🌡️ Mapa de Calor" },
    { id: "diplomacy", label: "🤝 Diplomacia" },
    { id: "members", label: "👥 Roster" },
  ];

  const attackCount = intel.filter(i => i.actionType === "ATTACK").length;
  const alertCount = intel.filter(i => i.actionType === "ALERT").length;

  return (
    <div className="slide-in">
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 bg-red-900/50 border border-red-600 rounded-lg flex items-center justify-center">
            <span className="text-red-400 text-xl">👁️</span>
          </div>
          <div>
            <h2 className="text-xl font-bold text-red-400">RADAR DE INTELIGENCIA</h2>
            <p className="text-xs text-gray-500">Acceso Maestro — Vista Global Multi-Servidor</p>
          </div>
        </div>
        <button
          onClick={onLock}
          className="text-xs text-gray-500 hover:text-red-400 border border-gray-700 hover:border-red-700 px-3 py-1.5 rounded-lg transition"
        >
          🔒 Bloquear
        </button>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <StatCard label="Intel Total" value={intel.length} color="red" />
        <StatCard label="Ataques" value={attackCount} color="red" />
        <StatCard label="Alertas" value={alertCount} color="gold" />
        <StatCard label="Pactos Diplomáticos" value={diplomacy.pacts.length} color="blue" />
      </div>

      <div className="flex gap-1 mb-4 bg-gray-900/50 p-1 rounded-lg border border-gray-800">
        {tabs.map(t => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            className={`flex-1 text-xs py-2 px-3 rounded-md transition font-medium ${
              tab === t.id
                ? "bg-red-800/60 text-red-200 border border-red-700"
                : "text-gray-500 hover:text-gray-300"
            }`}
          >
            {t.label}
          </button>
        ))}
      </div>

      {loading ? (
        <div className="text-center py-16 text-gray-600">
          <div className="text-4xl mb-3 pulse">⏳</div>
          <p>Cargando datos de inteligencia...</p>
        </div>
      ) : (
        <>
          {tab === "intel" && (
            <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
              {intel.length === 0 && (
                <div className="text-center py-10 text-gray-600">
                  <div className="text-3xl mb-2">📡</div>
                  <p>Sin datos de inteligencia aún</p>
                </div>
              )}
              {intel.map((item, i) => (
                <div key={i} className="bg-gray-900/60 border border-gray-800 rounded-lg p-3 flex items-start gap-3 hover:border-gray-700 transition">
                  <Badge type={item.actionType} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-mono text-yellow-400">{item.coords}</span>
                      <span className="text-xs text-gray-600">{new Date(item.timestamp).toLocaleString("es-ES")}</span>
                    </div>
                    <p className="text-sm text-gray-300 mt-0.5 truncate">{item.details}</p>
                    <p className="text-xs text-gray-600 mt-0.5">Alliance: <span className="text-gray-400">{item.allianceTag}</span> · Guild: {item.sourceGuildId}</p>
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === "heatmap" && (
            <ConflictHeatmap intel={intel} />
          )}

          {tab === "diplomacy" && (
            <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
              {diplomacy.pacts.length === 0 && (
                <div className="text-center py-10 text-gray-600">
                  <div className="text-3xl mb-2">🤝</div>
                  <p>Sin pactos diplomáticos registrados</p>
                </div>
              )}
              {diplomacy.pacts.map((pact, i) => (
                <div key={i} className="bg-gray-900/60 border border-gray-800 rounded-lg p-3 flex items-center gap-3 hover:border-gray-700 transition">
                  <Badge type={pact.pactType} />
                  <div className="flex-1">
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-sm text-white">{pact.targetAlliance}</span>
                      <span className="text-xs text-gray-600">{diplomacy.guildMap[pact.guildId] ?? pact.guildId}</span>
                    </div>
                    {pact.details && <p className="text-xs text-gray-400 mt-0.5">{pact.details}</p>}
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === "members" && (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-gray-800 text-xs text-gray-500 uppercase">
                    <th className="text-left py-2 pr-4">IGN</th>
                    <th className="text-left py-2 pr-4">Character ID</th>
                    <th className="text-left py-2 pr-4">Alliance</th>
                    <th className="text-right py-2 pr-4">Power</th>
                    <th className="text-center py-2">Warns</th>
                  </tr>
                </thead>
                <tbody>
                  {members.length === 0 && (
                    <tr><td colSpan="5" className="text-center py-8 text-gray-600">Sin miembros registrados</td></tr>
                  )}
                  {members.map((m, i) => (
                    <tr key={i} className="border-b border-gray-900 hover:bg-gray-800/30 transition">
                      <td className="py-2 pr-4 font-medium text-white">{m.ign}</td>
                      <td className="py-2 pr-4 font-mono text-xs text-gray-400">{m.characterId}</td>
                      <td className="py-2 pr-4 text-gray-300">{m.alliance || "—"}</td>
                      <td className="py-2 pr-4 text-right text-blue-400">{m.power ? m.power.toLocaleString() : "—"}</td>
                      <td className="py-2 text-center">
                        <span className={`text-xs font-bold ${m.warns > 0 ? "text-red-400" : "text-gray-600"}`}>
                          {m.warns}/3
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Public Alliance Panel ─────────────────────────────────────────────────────
function PublicPanel({ guilds, health }) {
  const [selected, setSelected] = useState(null);
  const [guildData, setGuildData] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!selected) return;
    setLoading(true);
    setGuildData(null);
    apiFetch(`/api/dashboard/guilds/${selected}`).then(d => {
      setGuildData(d);
      setLoading(false);
    });
  }, [selected]);

  const pactColors = { NAP: "text-yellow-400", ALLY: "text-green-400", ENEMY: "text-red-400", BORDER: "text-blue-400" };

  return (
    <div className="slide-in">
      <div className="mb-6">
        <h2 className="text-lg font-bold text-gray-200 mb-1">Seleccionar Servidor</h2>
        <p className="text-xs text-gray-500">Selecciona una alianza para ver sus estadísticas públicas</p>
      </div>

      {guilds.length === 0 ? (
        <div className="text-center py-16 text-gray-600">
          <div className="text-4xl mb-3">🏰</div>
          <p>No hay servidores registrados aún</p>
          <p className="text-xs mt-2">Configura el bot con <code className="bg-gray-800 px-1 rounded">/setup alliance</code></p>
        </div>
      ) : (
        <>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            {guilds.map(g => (
              <button
                key={g.guildId}
                onClick={() => setSelected(g.guildId)}
                className={`p-4 rounded-xl border text-left transition ${
                  selected === g.guildId
                    ? "border-blue-500 bg-blue-900/20 glow-blue"
                    : "border-gray-700 bg-gray-900/40 hover:border-gray-600"
                }`}
              >
                <p className="font-bold text-white text-lg">[{g.allianceTag}]</p>
                <p className="text-xs text-gray-500 mt-1 truncate">ID: {g.guildId}</p>
              </button>
            ))}
          </div>

          {loading && (
            <div className="text-center py-10 text-gray-600">
              <div className="pulse text-3xl mb-2">⏳</div>
              <p>Cargando datos...</p>
            </div>
          )}

          {guildData && !loading && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 slide-in">
              <StatCard label="Miembros Registrados" value={guildData.memberCount} color="blue" />
              <StatCard label="Con Advertencias" value={guildData.warnedCount} color="red" sub="Jugadores con warns activos" />
              <StatCard label="Pactos Diplomáticos" value={guildData.pacts?.length ?? 0} color="gold" />
              <StatCard label="Tag de Alianza" value={`[${guildData.config?.allianceTag}]`} color="green" />

              {guildData.pacts?.length > 0 && (
                <div className="md:col-span-2 bg-gray-900/60 border border-gray-800 rounded-xl p-4">
                  <h3 className="text-sm font-semibold text-gray-300 mb-3">🛰️ Radar Diplomático</h3>
                  <div className="space-y-2">
                    {guildData.pacts.map((p, i) => (
                      <div key={i} className="flex items-center gap-3 py-1.5 border-b border-gray-800">
                        <Badge type={p.pactType} />
                        <span className="font-semibold text-sm text-white">{p.targetAlliance}</span>
                        {p.details && <span className="text-xs text-gray-500">— {p.details}</span>}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Master Key Modal ──────────────────────────────────────────────────────────
function MasterKeyModal({ onSubmit, onClose }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);

  const submit = () => {
    if (val === "COD_MASTER_INTEL") {
      onSubmit();
    } else {
      setErr(true);
      setTimeout(() => setErr(false), 1500);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50" onClick={onClose}>
      <div
        className="bg-gray-900 border border-red-800 rounded-2xl p-8 w-full max-w-sm shadow-2xl slide-in"
        onClick={e => e.stopPropagation()}
      >
        <div className="text-center mb-6">
          <div className="text-5xl mb-3">🔐</div>
          <h2 className="text-xl font-bold text-red-400">Acceso Restringido</h2>
          <p className="text-xs text-gray-500 mt-1">Introduce la clave de acceso maestra</p>
        </div>
        <input
          type="password"
          value={val}
          onChange={e => setVal(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()}
          placeholder="Clave de acceso..."
          className={`w-full bg-gray-800 border rounded-lg px-4 py-3 text-sm text-white placeholder-gray-600 outline-none focus:ring-1 transition ${
            err ? "border-red-500 focus:ring-red-500" : "border-gray-700 focus:ring-red-600"
          }`}
          autoFocus
        />
        {err && <p className="text-red-400 text-xs mt-2 text-center">⚠️ Clave incorrecta</p>}
        <button
          onClick={submit}
          className="mt-4 w-full bg-red-700 hover:bg-red-600 text-white font-semibold py-2.5 rounded-lg transition"
        >
          Acceder
        </button>
        <button
          onClick={onClose}
          className="mt-2 w-full text-gray-600 hover:text-gray-400 text-sm py-1.5 transition"
        >
          Cancelar
        </button>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [health, setHealth] = useState(null);
  const [guilds, setGuilds] = useState([]);
  const [masterMode, setMasterMode] = useState(false);
  const [showModal, setShowModal] = useState(false);
  const logoClickCount = useRef(0);
  const logoTimer = useRef(null);

  useEffect(() => {
    apiFetch("/api/healthz").then(h => setHealth(h));
    apiFetch("/api/dashboard/guilds").then(d => setGuilds(d?.guilds ?? []));
  }, []);

  const handleLogoClick = () => {
    logoClickCount.current += 1;
    clearTimeout(logoTimer.current);
    logoTimer.current = setTimeout(() => { logoClickCount.current = 0; }, 3000);
    if (logoClickCount.current >= 5) {
      logoClickCount.current = 0;
      setShowModal(true);
    }
  };

  const discordColor = health?.discord === "online" ? "text-green-400" : "text-red-400";
  const mongoColor = health?.mongo === "connected" ? "text-green-400" : "text-red-400";

  return (
    <div className="min-h-screen">
      {showModal && !masterMode && (
        <MasterKeyModal
          onSubmit={() => { setMasterMode(true); setShowModal(false); }}
          onClose={() => setShowModal(false)}
        />
      )}

      {/* Header */}
      <header className="border-b border-gray-800/50 bg-gray-950/80 backdrop-blur-sm sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3 cursor-pointer select-none" onClick={handleLogoClick}>
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center border transition ${
              masterMode
                ? "bg-red-900/50 border-red-600 glow-red"
                : "bg-blue-900/50 border-blue-700"
            }`}>
              <span className="text-xl">🐉</span>
            </div>
            <div>
              <h1 className="font-bold text-white tracking-tight leading-tight">Kingdom Guardian Pro</h1>
              <p className="text-xs text-gray-600">Call of Dragons — Sistema de Gestión Militar</p>
            </div>
          </div>

          <div className="flex items-center gap-4">
            {/* Status indicators */}
            <div className="hidden md:flex items-center gap-4 text-xs">
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${health?.discord === "online" ? "bg-green-400 pulse" : "bg-red-500"}`} />
                <span className={discordColor}>Discord</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${health?.mongo === "connected" ? "bg-green-400 pulse" : "bg-red-500"}`} />
                <span className={mongoColor}>MongoDB</span>
              </div>
            </div>

            {masterMode && (
              <span className="text-xs bg-red-900/40 border border-red-700 text-red-300 px-3 py-1 rounded-full font-semibold">
                🔴 MODO MAESTRO
              </span>
            )}
          </div>
        </div>
      </header>

      {/* Main Content */}
      <main className="max-w-7xl mx-auto px-6 py-8">
        {/* Banner */}
        <div className={`rounded-2xl p-6 mb-8 border ${
          masterMode
            ? "bg-red-950/30 border-red-800/50 glow-red"
            : "bg-blue-950/30 border-blue-800/50 glow-blue"
        }`}>
          <div className="flex items-center gap-3 mb-2">
            <span className="text-2xl">{masterMode ? "👁️" : "⚔️"}</span>
            <h2 className="text-xl font-bold text-white">
              {masterMode ? "RADAR DE INTELIGENCIA — ACCESO MAESTRO" : "Centro de Comando — Vista Pública"}
            </h2>
          </div>
          <p className="text-sm text-gray-400">
            {masterMode
              ? "Visualización global de ataques, pactos diplomáticos e historial de espionaje de todos los servidores activos."
              : "Estadísticas públicas de alianzas, directivas militares y estado del servidor. Haz clic 5 veces en el logo para acceso avanzado."}
          </p>
        </div>

        {/* Commands Quick Reference */}
        {!masterMode && (
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-8">
            {[
              { icon: "🛡️", label: "El Centinela", desc: "/mod ban/kick/mute/warn/clear" },
              { icon: "⚔️", label: "Comando Táctico", desc: "/war alert/attack/defense" },
              { icon: "📦", label: "Banco de Suministros", desc: "/request resources" },
              { icon: "🔍", label: "El Sweeper", desc: "/roster sweep" },
              { icon: "🤝", label: "Panel Diplomático", desc: "/diplomacy radar/add" },
            ].map((m, i) => (
              <div key={i} className="bg-gray-900/50 border border-gray-800 rounded-xl p-3 text-center hover:border-gray-700 transition">
                <div className="text-2xl mb-1">{m.icon}</div>
                <p className="text-xs font-semibold text-gray-200">{m.label}</p>
                <p className="text-xs text-gray-600 mt-0.5 font-mono">{m.desc}</p>
              </div>
            ))}
          </div>
        )}

        {masterMode
          ? <MasterIntelPanel onLock={() => setMasterMode(false)} />
          : <PublicPanel guilds={guilds} health={health} />
        }
      </main>

      {/* Footer */}
      <footer className="border-t border-gray-800/50 mt-16 py-6">
        <div className="max-w-7xl mx-auto px-6 flex items-center justify-between text-xs text-gray-700">
          <p>Kingdom Guardian Pro © 2025 — Call of Dragons</p>
          <p>Multi-Tenancy · MongoDB Atlas · discord.js v14</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<div id="root"></div>
</body>
</html>
